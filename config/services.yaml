parameters:
    env(MEMO_DEV_PHP_BINARY): ''
    env(MEMO_DEV_COMPOSER_BINARY): ''

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Memo\DevBundle\Service\DomainMatcher: ~

    Memo\DevBundle\EventListener\GeneratePageListener:
        arguments:
            $scopeMatcher: '@contao.routing.scope_matcher'
            $responseContextAccessor: '@contao.routing.response_context_accessor'
            $domainMatcher: '@Memo\DevBundle\Service\DomainMatcher'
        tags:
            - { name: kernel.event_listener, event: kernel.response, method: __invoke, priority: 100 }

    Memo\DevBundle\EventListener\RobotsTxtListener:
        arguments:
            $domainMatcher: '@Memo\DevBundle\Service\DomainMatcher'
        tags:
            - { name: kernel.event_listener, event: contao.robots_txt, method: __invoke, priority: -100 }

    Memo\DevBundle\EventListener\ParseBackendTemplateListener:
        arguments:
            $domainMatcher: '@Memo\DevBundle\Service\DomainMatcher'
        tags:
            - { name: contao.hook, hook: parseBackendTemplate }
        public: true

    Memo\DevBundle\EventListener\ParseFrontendTemplateListener:
        arguments:
            $framework: '@contao.framework'
        tags:
            - { name: contao.hook, hook: parseFrontendTemplate }
        public: true

    Memo\DevBundle\EventListener\DataContainer\SaveDevSettingsCallback:
        arguments:
            $cacheDir: '%kernel.cache_dir%'
            $container: '@service_container'
        tags:
            - { name: contao.callback, table: tl_settings, target: config.onsubmit, method: onSubmitCallback, priority: 100 }
        public: true

    Memo\DevBundle\EventSubscriber\KernelRequestSubscriber:
        arguments:
            $scopeMatcher: '@contao.routing.scope_matcher'
            $tokenStorage: '@security.token_storage'
            $router: '@router'
            $framework: '@contao.framework'

    memo.dev.pagebackendtemplatelistener:
        alias: Memo\DevBundle\EventListener\ParseBackendTemplateListener
        public: true

    Memo\DevBundle\VersionSwitch\BinaryResolver:
        arguments:
            $phpBinary: '%env(MEMO_DEV_PHP_BINARY)%'
            $composerBinary: '%env(MEMO_DEV_COMPOSER_BINARY)%'

    Memo\DevBundle\VersionSwitch\GitRepository:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Memo\DevBundle\VersionSwitch\StatusStore:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Memo\DevBundle\VersionSwitch\SwitchLauncher:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Memo\DevBundle\Command\SwitchTagCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Memo\DevBundle\Command\RestoreBackupCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Memo\DevBundle\VersionSwitch\RunFormatter: ~

    Memo\DevBundle\Controller\VersionSwitchController: ~

    Memo\DevBundle\Controller\VersionPollController:
        arguments:
            $secret: '%kernel.secret%'

    Memo\DevBundle\EventListener\DataContainer\VersionSwitchCallback:
        tags:
            - { name: contao.callback, table: tl_settings, target: config.onload, method: onLoad }
            - { name: contao.callback, table: tl_settings, target: fields.memo_version_tag.options, method: getTagOptions }
            - { name: contao.callback, table: tl_settings, target: fields.memo_version_tag.load, method: loadCurrentTag }
            - { name: contao.callback, table: tl_settings, target: fields.memo_version_tag.save, method: saveEmpty }
            - { name: contao.callback, table: tl_settings, target: fields.memo_version_tag.wizard, method: getButtons }
        public: true
